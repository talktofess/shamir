name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Demo
        run: ./build/shamir demo

      - name: Split / combine round-trip
        run: |
          ./build/shamir split "ci secret" 2 3 | grep '^SSS1' > shares.txt
          out=$(./build/shamir combine $(sed -n '1p;3p' shares.txt))
          echo "$out"
          echo "$out" | grep -q 'ci secret'
