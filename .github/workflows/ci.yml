name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Demo
        run: ./build/shamir demo

      - name: Split / combine round-trip
        run: |
          ./build/shamir split "ci secret" 2 3 | grep '^SSS1' > shares.txt
          out=$(./build/shamir combine $(sed -n '1p;3p' shares.txt))
          echo "$out"
          echo "$out" | grep -q 'ci secret'

      - name: Binary file round-trip
        run: |
          head -c 64 /dev/urandom > secret.bin
          ./build/shamir split-file secret.bin 3 5 > shares.txt
          sed -n '1p;2p;4p;6p' shares.txt > three.txt   # comment + 3 of 5 shares
          ./build/shamir combine-file three.txt > out.bin
          cmp secret.bin out.bin && echo "binary round-trip OK"
